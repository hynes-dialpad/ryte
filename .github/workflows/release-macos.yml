name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Sign, notarize, and publish Apple Silicon DMG
    runs-on: macos-14
    environment: release

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm tag matches app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm release:check

      - name: Restore App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm release:mac:arm64

      - name: Verify signed application and DMG
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}" node scripts/verify-mac-release.mjs
          shasum -a 256 "dist/ryte-${RELEASE_VERSION#v}-arm64.dmg" > "dist/ryte-${RELEASE_VERSION#v}-arm64.dmg.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" "dist/ryte-${VERSION}-arm64.dmg" "dist/ryte-${VERSION}-arm64.dmg.sha256" \
            --verify-tag \
            --title "Ryte $RELEASE_TAG" \
            --generate-notes
